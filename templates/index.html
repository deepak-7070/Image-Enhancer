<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Enhancer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin: 15px 0;
            color: #333;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-enhance {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-enhance:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-enhance:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-save {
            background: #10b981;
            color: white;
            display: none;
        }

        .btn-save:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .preview {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Image Enhancer</h1>
        <p class="subtitle">Upscale your images to 4K with AI enhancement</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p>Click to select an image or drag & drop</p>
            <p style="font-size: 12px; color: #999; margin-top: 10px;">Supports: JPG, PNG, BMP, TIFF</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="file-name" id="fileName"></div>

        <button class="btn btn-enhance" id="enhanceBtn" disabled>
            Enhance Image
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="status">Enhancing your image... This may take a few seconds</p>
        </div>

        <div class="preview" id="preview">
            <img id="resultImg" alt="Enhanced Image">
        </div>

        <button class="btn btn-save" id="saveBtn">
            💾 Save Enhanced Image
        </button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const enhanceBtn = document.getElementById('enhanceBtn');
        const loading = document.getElementById('loading');
        const preview = document.getElementById('preview');
        const resultImg = document.getElementById('resultImg');
        const saveBtn = document.getElementById('saveBtn');

        let selectedFile = null;
        let enhancedBlob = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Please select a valid image file');
                return;
            }

            selectedFile = file;
            fileName.textContent = `Selected: ${file.name}`;
            enhanceBtn.disabled = false;
            preview.style.display = 'none';
            saveBtn.style.display = 'none';
        }

        // Enhance button
        enhanceBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            enhanceBtn.disabled = true;
            loading.style.display = 'block';
            preview.style.display = 'none';
            saveBtn.style.display = 'none';

            try {
                const response = await fetch('/enhance', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Enhancement failed');
                }

                enhancedBlob = await response.blob();
                const url = URL.createObjectURL(enhancedBlob);
                
                resultImg.src = url;
                preview.style.display = 'block';
                saveBtn.style.display = 'block';
                
            } catch (error) {
                alert('Error enhancing image: ' + error.message);
            } finally {
                loading.style.display = 'none';
                enhanceBtn.disabled = false;
            }
        });

        // Save button
        saveBtn.addEventListener('click', () => {
            if (!enhancedBlob) return;

            const url = URL.createObjectURL(enhancedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'enhanced_image.png';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
